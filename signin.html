<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Vehicle Tracking System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050816;
      --cyan: #22d3ee;
      --violet: #8b5cf6;
      --text: #e6edf7;
      --muted: #94a3b8;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: "Inter", "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      overflow: hidden;
      position: relative;
    }

    /* Animated grid floor */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(34,211,238,.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34,211,238,.07) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
      animation: gridMove 12s linear infinite;
    }
    @keyframes gridMove { to { background-position: 0 48px, 48px 0; } }

    /* Glowing orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      opacity: .45;
      z-index: 0;
      animation: float 10s ease-in-out infinite alternate;
    }
    .orb.one { width: 380px; height: 380px; background: var(--violet); top: -120px; left: -100px; }
    .orb.two { width: 340px; height: 340px; background: var(--cyan); bottom: -120px; right: -90px; animation-delay: -4s; }
    @keyframes float { to { transform: translate(30px, 40px) scale(1.1); } }

    /* Back link */
    .back {
      position: fixed;
      top: 22px;
      left: 22px;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 1px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.05);
      transition: color .2s, border-color .2s, transform .2s;
    }
    .back:hover { color: var(--cyan); border-color: rgba(34,211,238,.5); transform: translateX(-3px); }
    .back svg { width: 16px; height: 16px; }

    /* Card */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      text-align: center;
      padding: 40px 34px 32px;
      border-radius: 28px;
      background: linear-gradient(160deg, rgba(255,255,255,.09), rgba(255,255,255,.03));
      border: 1px solid rgba(255,255,255,.14);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 30px 80px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.15);
      animation: rise .8s ease both;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(24px); } }

    /* Corner accents */
    .card::before, .card::after {
      content: "";
      position: absolute;
      width: 34px; height: 34px;
      border: 2px solid var(--cyan);
      opacity: .8;
    }
    .card::before { top: 14px; left: 14px; border-right: 0; border-bottom: 0; border-top-left-radius: 10px; }
    .card::after  { bottom: 14px; right: 14px; border-left: 0; border-top: 0; border-bottom-right-radius: 10px; }

    /* Icon (smaller version of the home page icon) */
    .logo { width: 96px; height: 96px; margin: 0 auto 14px; filter: drop-shadow(0 0 16px rgba(34,211,238,.55)); }
    .logo svg { width: 100%; height: 100%; overflow: visible; }
    .ring-spin  { transform-box: fill-box; transform-origin: center; animation: spin 9s linear infinite; }
    .ring-spin2 { transform-box: fill-box; transform-origin: center; animation: spin 14s linear infinite reverse; }
    .pulse      { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-out infinite; }
    .pulse.p2   { animation-delay: 1.2s; }
    .pin        { animation: bob 3s ease-in-out infinite; }
    @keyframes spin  { to { transform: rotate(360deg); } }
    @keyframes pulse { 0% { transform: scale(.3); opacity: .9; } 100% { transform: scale(1.6); opacity: 0; } }
    @keyframes bob   { 50% { transform: translateY(-4px); } }

    h1 {
      font-family: "Orbitron", "Segoe UI", sans-serif;
      font-weight: 800;
      font-size: 26px;
      letter-spacing: 2px;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #fff, var(--cyan) 60%, var(--violet));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .sub { color: var(--muted); font-size: 14px; line-height: 1.6; margin-bottom: 28px; }

    /* Form */
    form { text-align: left; }

    .field { margin-bottom: 18px; }

    label {
      display: block;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--cyan);
      margin-bottom: 8px;
    }

    .input-wrap { position: relative; }

    .input-wrap > svg.lead {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px; height: 18px;
      color: var(--muted);
      transition: color .2s;
      pointer-events: none;
    }

    input {
      width: 100%;
      padding: 14px 44px 14px 44px;
      font-family: inherit;
      font-size: 15px;
      color: var(--text);
      background: rgba(255,255,255,.05);
      border: 1.5px solid rgba(255,255,255,.14);
      border-radius: 14px;
      outline: none;
      transition: border-color .2s, box-shadow .2s, background .2s;
    }
    input::placeholder { color: #64748b; }
    input:focus {
      border-color: var(--cyan);
      background: rgba(34,211,238,.06);
      box-shadow: 0 0 0 4px rgba(34,211,238,.15), 0 0 24px rgba(34,211,238,.18);
    }
    .input-wrap:focus-within > svg.lead { color: var(--cyan); }

    .toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 32px; height: 32px;
      display: grid;
      place-items: center;
      background: none;
      border: 0;
      border-radius: 8px;
      color: var(--muted);
      cursor: pointer;
      transition: color .2s, background .2s;
    }
    .toggle:hover { color: var(--cyan); background: rgba(34,211,238,.1); }
    .toggle svg { width: 18px; height: 18px; }

    /* Live email validation states */
    .status {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%) scale(.6);
      width: 22px; height: 22px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      font-size: 13px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s, transform .2s;
    }
    .field.invalid .status { opacity: 1; transform: translateY(-50%) scale(1); background: rgba(251,113,133,.18); color: #fb7185; }
    .field.valid   .status { opacity: 1; transform: translateY(-50%) scale(1); background: rgba(34,197,94,.18);  color: #22c55e; }

    .field.invalid input {
      border-color: #fb7185;
      background: rgba(251,113,133,.07);
      box-shadow: 0 0 0 4px rgba(251,113,133,.15), 0 0 24px rgba(251,113,133,.2);
    }
    .field.invalid .input-wrap > svg.lead { color: #fb7185; }
    .field.invalid label { color: #fb7185; }

    .field.valid input {
      border-color: #22c55e;
      box-shadow: 0 0 0 4px rgba(34,197,94,.12), 0 0 22px rgba(34,197,94,.15);
    }
    .field.valid .input-wrap > svg.lead { color: #22c55e; }
    .field.valid label { color: #22c55e; }

    .hint {
      min-height: 0;
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      font-size: 12.5px;
      color: #fb7185;
      transition: max-height .25s, opacity .25s, margin .25s;
    }
    .field.invalid .hint { max-height: 30px; opacity: 1; margin-top: 8px; }

    .field.shake { animation: shake .4s; }
    @keyframes shake {
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .error {
      min-height: 18px;
      margin: -4px 0 10px;
      font-size: 13px;
      color: #fb7185;
    }

    .row {
      display: flex;
      justify-content: flex-end;
      margin: -4px 0 22px;
      font-size: 13px;
    }
    .row a { color: var(--muted); text-decoration: none; transition: color .2s; }
    .row a:hover { color: var(--cyan); }

    /* Button (same as home page primary button) */
    .btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 14px;
      font-family: "Orbitron", "Segoe UI", sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      overflow: hidden;
      color: #04101f;
      background: linear-gradient(90deg, var(--cyan), var(--violet));
      box-shadow: 0 8px 28px rgba(34,211,238,.35);
      transition: transform .2s, box-shadow .25s;
    }
    .btn svg { width: 18px; height: 18px; transition: transform .25s; }
    .btn:hover { transform: translateY(-3px); box-shadow: 0 12px 38px rgba(139,92,246,.55); }
    .btn:hover svg { transform: translateX(5px); }
    .btn:active { transform: translateY(0) scale(.98); }
    .btn::after {
      content: "";
      position: absolute;
      top: 0; left: -80%;
      width: 50%; height: 100%;
      background: linear-gradient(120deg, transparent, rgba(255,255,255,.55), transparent);
      transform: skewX(-20deg);
      transition: left .6s;
    }
    .btn:hover::after { left: 130%; }

    .switch {
      margin-top: 22px;
      padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,.08);
      text-align: center;
      font-size: 14px;
      color: var(--muted);
    }
    .switch a { color: var(--cyan); text-decoration: none; font-weight: 600; }
    .switch a:hover { text-decoration: underline; }

    @media (max-width: 420px) {
      .card { padding: 34px 22px 26px; }
      h1 { font-size: 22px; }
      .back { top: 14px; left: 14px; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="orb one"></div>
  <div class="orb two"></div>

  <!-- Back to home page -->
  <a href="index.html" class="back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
    Back
  </a>

  <main class="card">
    <!-- Same icon as the home page -->
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#22d3ee"/>
            <stop offset="1" stop-color="#8b5cf6"/>
          </linearGradient>
        </defs>
        <g class="ring-spin">
          <circle cx="60" cy="60" r="54" fill="none" stroke="url(#g)" stroke-width="1.5" stroke-dasharray="3 7" opacity=".8"/>
          <circle cx="60" cy="6" r="4" fill="#22d3ee"/>
        </g>
        <g class="ring-spin2">
          <circle cx="60" cy="60" r="44" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="40 60" stroke-linecap="round" opacity=".7"/>
        </g>
        <ellipse class="pulse"    cx="60" cy="90" rx="22" ry="7" fill="none" stroke="#22d3ee" stroke-width="1.5"/>
        <ellipse class="pulse p2" cx="60" cy="90" rx="22" ry="7" fill="none" stroke="#22d3ee" stroke-width="1.5"/>
        <ellipse cx="60" cy="90" rx="6" ry="2.2" fill="#22d3ee" opacity=".9"/>
        <g class="pin">
          <path d="M60 24 C47 24 37 34 37 46 C37 62 60 86 60 86 C60 86 83 62 83 46 C83 34 73 24 60 24 Z"
                fill="rgba(34,211,238,.12)" stroke="url(#g)" stroke-width="3" stroke-linejoin="round"/>
          <path d="M49 50 L52 42 Q53 40 55 40 L65 40 Q67 40 68 42 L71 50 Z" fill="url(#g)"/>
          <rect x="47" y="49" width="26" height="8" rx="3" fill="url(#g)"/>
          <circle cx="54" cy="58" r="3" fill="#050816" stroke="#22d3ee" stroke-width="1.5"/>
          <circle cx="66" cy="58" r="3" fill="#050816" stroke="#22d3ee" stroke-width="1.5"/>
        </g>
      </svg>
    </div>

    <h1>SIGN IN</h1>
    <p class="sub">Apne account me login karo aur apni gaadiyon ko track karo.</p>

    <form id="signinForm" novalidate>
      <div class="field" id="emailField">
        <label for="email">Email</label>
        <div class="input-wrap">
          <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 8l9 6 9-6"/></svg>
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
          <span class="status" id="emailStatus"></span>
        </div>
        <div class="hint" id="emailHint"></div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="3"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>
          <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
          <button type="button" class="toggle" id="togglePw" aria-label="Show or hide password">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <div class="error" id="error" role="alert"></div>

      <div class="row"><a href="#">Forgot password?</a></div>

      <button type="submit" class="btn">
        Sign In
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>

    <div class="switch">
      Account nahi hai? <a href="signup.html">Sign Up</a>
    </div>
  </main>

  <script>
    const form = document.getElementById("signinForm");
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const error = document.getElementById("error");
    const togglePw = document.getElementById("togglePw");

    // Show / hide password
    togglePw.addEventListener("click", () => {
      password.type = password.type === "password" ? "text" : "password";
    });

    // Live email validation
    const emailField = document.getElementById("emailField");
    const emailHint = document.getElementById("emailHint");
    const emailStatus = document.getElementById("emailStatus");
    const emailRegex = /^[a-zA-Z0-9._%+-]+@[a-zA-Z0-9-]+(\.[a-zA-Z0-9-]+)*\.[a-zA-Z]{2,}$/;

    function checkEmail(shake) {
      const value = email.value.trim();
      emailField.classList.remove("valid", "invalid");

      if (value === "") {
        emailHint.textContent = "";
        emailStatus.textContent = "";
        if (shake) {
          emailHint.textContent = "Email daalna zaroori hai.";
          emailField.classList.add("invalid");
          emailStatus.textContent = "✕";
          triggerShake();
        }
        return false;
      }

      if (emailRegex.test(value)) {
        emailField.classList.add("valid");
        emailStatus.textContent = "✓";
        emailHint.textContent = "";
        return true;
      }

      emailField.classList.add("invalid");
      emailStatus.textContent = "✕";
      emailHint.textContent = value.includes("@")
        ? "Invalid email address (jaise: name@gmail.com)"
        : "Invalid email: '@' missing hai";
      if (shake) triggerShake();
      return false;
    }

    function triggerShake() {
      emailField.classList.remove("shake");
      void emailField.offsetWidth; // restart animation
      emailField.classList.add("shake");
    }

    email.addEventListener("input", () => checkEmail(false));
    email.addEventListener("blur", () => { if (email.value.trim() !== "") checkEmail(false); });

    // Validate, then go to the next page
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      error.textContent = "";

      if (!checkEmail(true)) {
        email.focus();
        return;
      }
      if (password.value.length < 6) {
        error.textContent = "Password kam se kam 6 characters ka hona chahiye.";
        password.focus();
        return;
      }

      // TODO: yaha baad me backend se login check lagana
      // Next page (aap baad me banoge):
      window.location.href = "dashboard.html";
    });
  </script>
</body>
</html>
